    <line x1="400" y1="0" x2="400" y2="450" />
    <line x1="600" y1="0" x2="600" y2="450" />
  </g>

  <!-- Container -->
  <rect x="100" y="60" width="600" height="330" rx="16" fill="#1c1917" stroke="#eab308" stroke-width="2" stroke-opacity="0.35" />

