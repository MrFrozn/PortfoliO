    <text x="15" y="112" fill="#d6d3d1" font-family="sans-serif" font-size="11">3. Déploiement &amp; Tests de recette</text>
    <rect x="360" y="100" width="110" height="16" rx="4" fill="#10b981" />

    <!-- Task 4: Jalon Clôture -->
    <text x="15" y="142" fill="#d6d3d1" font-family="sans-serif" font-size="11">4. Revue de clôture &amp; Bilan IT</text>
