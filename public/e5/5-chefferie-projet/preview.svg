    <!-- Timeline Header -->
    <rect x="0" y="0" width="540" height="28" fill="#292524" rx="8 8 0 0" />
    <text x="15" y="19" fill="#e7e5e4" font-family="sans-serif" font-weight="bold" font-size="11">TACHES / JALONS DU PROJET</text>
    <text x="250" y="19" fill="#a8a29e" font-family="monospace" font-size="10">SEM 1</text>
    <text x="320" y="19" fill="#a8a29e" font-family="monospace" font-size="10">SEM 2</text>
    <text x="390" y="19" fill="#a8a29e" font-family="monospace" font-size="10">SEM 3</text>
    <text x="460" y="19" fill="#a8a29e" font-family="monospace" font-size="10">SEM 4</text>

    <!-- Task 1: Cadrage -->
    <text x="15" y="52" fill="#d6d3d1" font-family="sans-serif" font-size="11">1. Cadrage &amp; Expression des besoins</text>
