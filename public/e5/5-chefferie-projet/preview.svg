      <stop offset="0%" stop-color="#1c1917" />
      <stop offset="50%" stop-color="#2a2414" />
      <stop offset="100%" stop-color="#14110b" />
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg-grad-5)" />

  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
